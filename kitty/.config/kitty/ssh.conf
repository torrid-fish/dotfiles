# vim:ft=kitty
# Applies to `kitten ssh` only. Docs: sw.kovidgoyal.net/kitty/kittens/ssh/

hostname *

# Copy local COLORTERM to the remote shell. No sshd AcceptEnv needed.
env COLORTERM=_kitty_copy_env_var_

# terminfo is shipped automatically by the bootstrap.
shell_integration inherited
share_connections yes

# Don't fetch the kitten binary on remotes. Set to if-needed for icat/transfer.
remote_kitty no
